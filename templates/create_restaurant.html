{% extends "base.html" %}
{% block title %}Add Restaurant{% endblock %}
{% block content %}
    <section class="hero detail-hero">
        <div class="container">
            <a class="back-link" href="{{ url_for('index') }}"><i class="fa-solid fa-arrow-left me-1"></i> All restaurants</a>
            <h1 class="mt-3 mb-1">Add a restaurant</h1>
            <p class="lead mb-0">Know a great place in Chennai? Put it on the map.</p>
        </div>
    </section>

    <div class="container lift">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="panel form-panel">
                    <form method="POST" action="{{ url_for('add_restaurant') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="restaurant_name" class="form-label">Name</label>
                            <div class="input-icon">
                                <i class="fa-solid fa-store"></i>
                                <input type="text" class="form-control" id="restaurant_name" name="restaurant_name" maxlength="50" placeholder="e.g. Murugan Idli Shop" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="street_address" class="form-label">Street address</label>
                            <div class="input-icon">
                                <i class="fa-solid fa-location-dot"></i>
                                <input type="text" class="form-control" id="street_address" name="street_address" maxlength="50" placeholder="e.g. G.N. Chetty Road, T. Nagar" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="description" class="form-label">What's it known for?</label>
                            <div class="input-icon">
                                <i class="fa-solid fa-utensils"></i>
                                <input type="text" class="form-control" id="description" name="description" maxlength="250" placeholder="e.g. Soft idlis with podi and chutneys" required>
                            </div>
                        </div>
                        <div class="d-flex gap-2 justify-content-end">
                            <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
                            <button type="submit" class="btn btn-teal"><i class="fa-solid fa-check me-1"></i> Add restaurant</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
