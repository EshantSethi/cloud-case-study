{% set sr = star_rating(restaurant.id) %}
{% if sr["review_count"] %}
    <span class="stars" title="{{ '%.1f'|format(sr['avg_rating']) }} out of 5">
        <span class="track" aria-hidden="true">
            <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
            <span class="fill" style="width:{{ sr['stars_percent'] }}%">
                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>
            </span>
        </span>
        <span class="val">{{ '%.1f'|format(sr['avg_rating']) }}</span>
        <span class="cnt">({{ sr["review_count"] }} {{ "review" if sr["review_count"] == 1 else "reviews" }})</span>
    </span>
{% else %}
    <span class="no-rating">No ratings yet</span>
{% endif %}
